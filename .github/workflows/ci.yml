name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Type check runtime boundaries
        run: python -m mypy

      - name: Check Git whitespace
        env:
          GEOFLOW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${GEOFLOW_BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$GEOFLOW_BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi

      - name: Run tests
        run: timeout 5m python -m pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

      - name: Build Docker image
        run: docker build -t geoflow-ci .

      - name: Smoke test hardened runtime (DXF and DOCX)
        run: |
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
            --mount type=bind,source="$PWD/tools/qa_runtime.py",target=/qa_runtime.py,readonly \
            --mount type=bind,source="$PWD/tests/fixtures",target=/fixtures,readonly \
            geoflow-ci python /qa_runtime.py --check-image --fixtures /fixtures --output /tmp/qa
