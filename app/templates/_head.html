<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ page_title }}</title>
<script>
  // Apply the stored theme before the first paint to avoid a light flash.
  document.documentElement.classList.add("js");
  try {
    const theme = localStorage.getItem("geoflow-theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  } catch (error) {}
</script>
<link rel="stylesheet" href="{{ url_for("static", path="/style.css") }}?v={{ static_version }}">
<script src="{{ url_for("static", path="/app.js") }}?v={{ static_version }}" defer></script>
