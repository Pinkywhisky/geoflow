services:
  geoflow:
    build: .
    environment:
      ODA_FILE_CONVERTER: /usr/bin/ODAFileConverter
      ODA_QT_PLATFORM: xcb
      ODA_USE_XVFB: "1"
    ports:
      - "8080:8000"
    volumes:
      - geoflow-data:/data
      - type: bind
        source: ${ODA_FILE_CONVERTER_HOST:-/usr/bin/ODAFileConverter}
        target: /usr/bin/ODAFileConverter
        read_only: true
      - type: bind
        source: ${ODA_INSTALL_DIR_HOST:-/usr/bin/ODAFileConverter_27.1.0.0}
        target: /usr/bin/ODAFileConverter_27.1.0.0
        read_only: true
    networks:
      - geoflow-network
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    profiles:
      - tunnel
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    depends_on:
      geoflow:
        condition: service_healthy
    secrets:
      - cloudflare_tunnel_token
    networks:
      - geoflow-network
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  geoflow-data:

networks:
  geoflow-network:

secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token.txt
